<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Knowlegebases</title>
  <style>
    body {
      font-family: Arial, Helvetica, sans-serif;
      background-color: #fafafa;
      margin: 0;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
    }
    .container {
      text-align: center;
    }
    h1 {
      font-size: 1.8em;
      margin-bottom: 20px;
      color: #333;
    }
    ul {
      list-style: none;
      padding: 0;
      margin: 0;
    }
    li {
      margin: 10px 0;
    }
    a {
      text-decoration: none;
      color: #0066cc;
      font-size: 1.1em;
      transition: color 0.3s;
    }
    a:hover {
      color: #003d80;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Knowlegebases</h1>
    <ul>
      <li><a href="/legal/why.pdf">Why has your firm contacted me about a debt?</a></li>
      <li><a href="/legal/explain.pdf">Can you explain what this debt is and where it came from?</a></li>
      <li><a href="/legal/options.pdf">What are my options for paying or resolving the debt?</a></li>
      <li><a href="/legal/ignore.pdf">What happens if I can’t pay or don’t respond?</a></li>
      <li><a href="/legal/creditrating.pdf">Will this affect my credit file or lead to court action?</a></li>
    </ul>
  </div>
</body>
</html>
